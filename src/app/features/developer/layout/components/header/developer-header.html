<header class="user-header">
  <img
    src="https://res.cloudinary.com/dp1vgjhsq/image/upload/v1788755182/isotipo_ec9uxb.png"
    alt="ComuniDev"
    class="header-logo"
  />
  <div class="header-center">
    <div class="search-bar">
      <span class="material-symbols-outlined">search</span>
      <input type="text" placeholder="Buscar..." class="search-input" />
    </div>
    <nav class="header-nav">
      @for (link of links; track link.route; let i = $index) {
        <a #tabEl [routerLink]="link.route" routerLinkActive="active" class="nav-tab" (click)="onTabClick(i)">
          <span class="material-symbols-outlined">{{ link.icon || 'circle' }}</span>
          <span class="nav-tab-label">{{ link.label }}</span>
        </a>
      }
      <div class="nav-indicator" [class.hidden]="!showIndicator" [style.left.px]="indicatorLeft" [style.width.px]="indicatorWidth"></div>
    </nav>
  </div>
  <div class="header-right">
    <app-notification-bell />
  </div>
</header>
