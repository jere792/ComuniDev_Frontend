<header class="landing-header">
  <nav class="nav-capsule">
    <a routerLink="/" class="nav-logo">
      <img
        src="https://res.cloudinary.com/dp1vgjhsq/image/upload/v1788755182/isotipo_ec9uxb.png"
        alt="ComuniDev"
        class="nav-logo-img"
      />
    </a>
    <div class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-pill">Inicio</a>
      <a routerLink="/about" routerLinkActive="active" class="nav-pill">Sobre nosotros</a>
      <a routerLink="/contact" routerLinkActive="active" class="nav-pill">Contacto</a>
      <a routerLink="/download-apk" routerLinkActive="active" class="nav-pill">Descargar</a>
    </div>
  </nav>
  <div class="header-actions">
    <button class="theme-toggle" (click)="theme.toggle()" [attr.aria-label]="theme.dark() ? 'Modo claro' : 'Modo oscuro'">
      @if (theme.dark()) {
        <span class="material-symbols-outlined">light_mode</span>
      } @else {
        <span class="material-symbols-outlined">dark_mode</span>
      }
    </button>
    <a routerLink="/register" class="btn btn-primary header-cta">Registrarse</a>
  </div>
</header>
