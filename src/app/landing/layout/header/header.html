<header class="landing-header">
  <nav class="nav-capsule">
    <a routerLink="/" class="nav-logo">
      <img
        src="https://res.cloudinary.com/dp1vgjhsq/image/upload/v1788755182/isotipo_ec9uxb.png"
        alt="ComuniDev"
        class="nav-logo-img"
      />
    </a>
    <div class="nav-links" [class.open]="menuOpen()">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-pill"
        (click)="menuOpen.set(false)"
        >{{ 'header' | t:'inicio' }}</a
      >
      <a routerLink="/contact" routerLinkActive="active" class="nav-pill" (click)="menuOpen.set(false)">{{ 'header' | t:'contacto' }}</a>
      <a routerLink="/about" routerLinkActive="active" class="nav-pill" (click)="menuOpen.set(false)">{{ 'header' | t:'sobreNosotros' }}</a>
      <a routerLink="/download-apk" routerLinkActive="active" class="nav-pill" (click)="menuOpen.set(false)">{{ 'header' | t:'descargar' }}</a>
    </div>
  </nav>
  <div class="header-actions">
    <button class="menu-toggle" (click)="toggleMenu()" aria-label="Menu">
      <span class="material-symbols-outlined">{{ menuOpen() ? 'close' : 'menu' }}</span>
    </button>
    <button class="lang-toggle" (click)="language.toggle()" [attr.aria-label]="language.lang() === 'es' ? 'Switch to English' : 'Cambiar a Español'">
      <span class="lang-label" [class.active]="language.lang() === 'es'">ES</span>
      <span class="lang-divider">/</span>
      <span class="lang-label" [class.active]="language.lang() === 'en'">EN</span>
    </button>
    <button
      class="theme-toggle"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.dark() ? 'Modo claro' : 'Modo oscuro'"
    >
      @if (theme.dark()) {
        <span class="material-symbols-outlined">light_mode</span>
      } @else {
        <span class="material-symbols-outlined">dark_mode</span>
      }
    </button>
    <a routerLink="/register" class="btn btn-primary header-cta">{{ 'header' | t:'registrarse' }}</a>
  </div>
</header>
