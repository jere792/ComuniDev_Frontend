<app-page-hero
  badge="{{ 'about' | t:'badge' }}"
  title="{{ 'about' | t:'titulo' }}"
  subtitle="{{ 'about' | t:'subtitulo' }}"
  [info]="[
    { icon: 'groups', text: 'about' | t:'comunidadActiva' },
    { icon: 'code', text: 'about' | t:'openSource' },
    { icon: 'public', text: 'about' | t:'latamFirst' }
  ]">
  <div class="about-hero-visual">
    <div class="hero-terminal">
      <div class="terminal-header">
        <span class="terminal-dot"></span>
        <span class="terminal-dot"></span>
        <span class="terminal-dot"></span>
      </div>
      <div class="terminal-body">
        <span class="bracket-symbol">&lt; &gt;</span>
      </div>
    </div>
  </div>
</app-page-hero>
