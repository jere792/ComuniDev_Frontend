<section class="mission-section">
  <div class="mission-container">
    <div class="mission-header">
      <span class="badge">{{ 'about' | t:'proposito' }}</span>
      <h2 class="headline-lg">{{ 'about' | t:'misionVision' }}</h2>
    </div>

    <div class="mission-grid">
      <div class="mission-card">
        <div class="mission-card-icon">
          <span class="material-symbols-outlined">flag</span>
        </div>
        <h3 class="headline-sm">{{ 'about' | t:'mision' }}</h3>
        <p class="body-md">
          {{ 'about' | t:'misionDesc' }}
        </p>
      </div>

      <div class="mission-card">
        <div class="mission-card-icon">
          <span class="material-symbols-outlined">visibility</span>
        </div>
        <h3 class="headline-sm">{{ 'about' | t:'vision' }}</h3>
        <p class="body-md">
          {{ 'about' | t:'visionDesc' }}
        </p>
      </div>
    </div>
  </div>
</section>
