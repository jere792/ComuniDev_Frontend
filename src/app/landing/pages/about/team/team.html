<section class="team-section">
  <div class="team-container">
    <div class="team-header">
      <span class="badge">{{ 'about' | t:'equipo' }}</span>
      <h2 class="headline-lg">{{ 'about' | t:'quienesSomos' }}</h2>
      <p class="body-lg">{{ 'about' | t:'equipoDesc' }}</p>
    </div>

    <div class="team-grid">
      <div class="team-card">
        <div class="team-avatar">
          <img src="https://res.cloudinary.com/dp1vgjhsq/image/upload/v1788774945/buble_mascota_kmpn3v.png" alt="Fundador" />
        </div>
        <h3 class="headline-sm">{{ 'about' | t:'fundador' }}</h3>
        <span class="label-md team-role">{{ 'about' | t:'rolFundador' }}</span>
        <p class="body-sm team-bio">{{ 'about' | t:'fundadorDesc' }}</p>
      </div>

      <div class="team-card team-card-cta">
        <div class="team-cta-content">
          <span class="material-symbols-outlined team-cta-icon">group_add</span>
          <h3 class="headline-sm">{{ 'about' | t:'uneteEquipo' }}</h3>
          <p class="body-md">{{ 'about' | t:'uneteDesc' }}</p>
          <a href="/contact" class="btn btn-primary">
            <span class="label-lg">{{ 'about' | t:'contactanos' }}</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
