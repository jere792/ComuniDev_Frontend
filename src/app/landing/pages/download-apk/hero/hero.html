<app-page-hero
  badge="Descargas"
  title="ComuniDev en tu bolsillo"
  subtitle="Descarga la app y accede a la comunidad tech desde cualquier lugar. Conecta, aprende y crece profesionalmente."
  [info]="[
    { icon: 'android', text: 'Android 8.0+' },
    { icon: 'download', text: 'APK directo' },
    { icon: 'security', text: '100% seguro' }
  ]">
  <div class="download-hero-visual">
    <div class="phone-mockup">
      <div class="phone-status-bar">
        <span class="status-time">12:00</span>
        <div class="status-icons">
          <span class="material-symbols-outlined">signal_cellular_alt</span>
          <span class="material-symbols-outlined">wifi</span>
          <span class="material-symbols-outlined">battery_full</span>
        </div>
      </div>
      <div class="phone-screen">
        <div class="phone-app-header">
          <img src="https://res.cloudinary.com/dp1vgjhsq/image/upload/v1788755182/isotipo_ec9uxb.png" alt="ComuniDev" class="phone-logo" />
          <span class="phone-app-name">ComuniDev</span>
        </div>
        <div class="phone-app-body">
          <span class="material-symbols-outlined phone-download-icon">download</span>
          <span class="phone-version">v1.0.0</span>
        </div>
      </div>
      <div class="phone-notch"></div>
    </div>
  </div>
</app-page-hero>
