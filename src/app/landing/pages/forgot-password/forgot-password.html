<section class="forgot-page">
  <div class="card forgot-card">
    <h1 class="headline-md">{{ 'forgotPassword' | t:'titulo' }}</h1>
    <p class="body-md forgot-subtitle">{{ 'forgotPassword' | t:'subtitulo' }}</p>

    <form class="forgot-form">
      <div class="form-group">
        <label class="label-md" for="email">{{ 'forgotPassword' | t:'email' }}</label>
        <input class="input" type="email" id="email" [placeholder]="'forgotPassword' | t:'emailPlaceholder'">
      </div>
      <button type="submit" class="btn btn-primary forgot-btn">{{ 'forgotPassword' | t:'enviar' }}</button>
    </form>

    <p class="body-sm forgot-footer"><a routerLink="/" class="forgot-link">{{ 'forgotPassword' | t:'volver' }}</a></p>
  </div>
</section>
