<section class="forgot-page">
  <div class="card forgot-card">
    <h1 class="headline-md">Recuperar contraseña</h1>
    <p class="body-md forgot-subtitle">Ingresa tu email y te enviaremos las instrucciones.</p>

    <form class="forgot-form">
      <div class="form-group">
        <label class="label-md" for="email">Email</label>
        <input class="input" type="email" id="email" placeholder="tu@email.com">
      </div>
      <button type="submit" class="btn btn-primary forgot-btn">Enviar instrucciones</button>
    </form>

    <p class="body-sm forgot-footer"><a routerLink="/" class="forgot-link">Volver al inicio</a></p>
  </div>
</section>
