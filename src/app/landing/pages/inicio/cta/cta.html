<section class="cta-section">
  <div class="cta-shell">
    <span class="cta-badge">{{ 'cta' | t:'titulo' }}</span>
    <h2 class="cta-title">{{ 'cta' | t:'subtitulo' }}</h2>
    <p class="cta-desc body-lg">
      {{ 'cta' | t:'descripcion' }}
    </p>
    <div class="cta-actions">
      <a routerLink="/register" class="btn btn-primary cta-btn">{{ 'cta' | t:'crearCuenta' }}</a>
      <a routerLink="/features" class="btn btn-outline cta-btn">{{ 'cta' | t:'explorar' }}</a>
    </div>
    <div class="cta-meta">
      <span class="cta-meta-item">
        <span class="material-symbols-outlined" style="font-size:16px">check_circle</span>
        {{ 'cta' | t:'sinTarjeta' }}
      </span>
      <span class="cta-meta-item">
        <span class="material-symbols-outlined" style="font-size:16px">check_circle</span>
        {{ 'cta' | t:'accesoInmediato' }}
      </span>
      <span class="cta-meta-item">
        <span class="material-symbols-outlined" style="font-size:16px">check_circle</span>
        {{ 'cta' | t:'cancela' }}
      </span>
    </div>
  </div>
</section>
