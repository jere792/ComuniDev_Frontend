<section class="login-page">
  <div class="card login-card">
    <h1 class="headline-md">Iniciar sesión</h1>
    <p class="body-md login-subtitle">Bienvenido de vuelta a ComuniDev.</p>

    <form class="login-form">
      <div class="form-group">
        <label class="label-md" for="email">Email</label>
        <input class="input" type="email" id="email" placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label class="label-md" for="password">Contraseña</label>
        <input class="input" type="password" id="password" placeholder="Tu contraseña">
      </div>
      <div class="login-options">
        <a routerLink="/forgot-password" class="login-forgot">¿Olvidaste tu contraseña?</a>
      </div>
      <button type="submit" class="btn btn-primary login-btn">Iniciar sesión</button>
    </form>

    <p class="body-sm login-footer">¿No tienes cuenta? <a routerLink="/register" class="login-link">Regístrate</a></p>
  </div>
</section>
