<section class="register-page">
  <div class="card register-card">
    <h1 class="headline-md">Crear cuenta</h1>
    <p class="body-md register-subtitle">Únete a la comunidad tech más completa.</p>

    <form class="register-form">
      <div class="form-group">
        <label class="label-md" for="name">Nombre</label>
        <input class="input" type="text" id="name" placeholder="Tu nombre completo">
      </div>
      <div class="form-group">
        <label class="label-md" for="email">Email</label>
        <input class="input" type="email" id="email" placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label class="label-md" for="password">Contraseña</label>
        <input class="input" type="password" id="password" placeholder="Mínimo 8 caracteres">
      </div>
      <button type="submit" class="btn btn-primary register-btn">Registrarse</button>
    </form>

    <p class="body-sm register-footer">¿Ya tienes cuenta? <a routerLink="/" class="register-link">Iniciar sesión</a></p>
  </div>
</section>
