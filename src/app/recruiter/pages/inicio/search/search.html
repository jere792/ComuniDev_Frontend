<div class="search-section">
  <div class="search-bar">
    <span class="material-symbols-outlined">search</span>
    <input
      type="text"
      placeholder="Buscar candidatos, habilidades..."
      [(ngModel)]="searchTerm"
      (keyup.enter)="search()"
      class="search-input"
    />
    @if (searchTerm) {
      <button class="clear-btn" (click)="searchTerm = ''">
        <span class="material-symbols-outlined">close</span>
      </button>
    }
  </div>

  @if (recentSearches.length > 0 && !searchTerm) {
    <div class="recent-searches">
      <div class="recent-header">
        <span class="recent-title">Recientes</span>
        <button class="clear-all" (click)="clearRecent()">Limpiar</button>
      </div>
      <div class="recent-tags">
        @for (search of recentSearches; track search) {
          <span class="recent-tag" (click)="searchTerm = search">
            <span class="material-symbols-outlined">history</span>
            {{ search }}
          </span>
        }
      </div>
    </div>
  }
</div>
