<nav class="bottom-nav">
  @for (link of linksMovil; track link.route) {
    <a class="bottom-nav-item" [routerLink]="link.route" routerLinkActive="active">
      @if (esPerfil(link.route) && avatarUrl) {
        <img class="bottom-nav-avatar" [src]="avatarUrl" alt="Perfil" />
      } @else {
        <span class="material-symbols-outlined">{{ link.icon || 'circle' }}</span>
      }
      <span class="bottom-nav-label">{{ link.label }}</span>
    </a>
  }
</nav>
